 stage.addEventListener('pointerdown',e=>{stage.setPointerCapture(e.pointerId);points.set(e.pointerId,[e.clientX,e.clientY]);drag=[e.clientX,e.clientY];if(points.size===2){const p=[...points.values()];pinch=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);}});
 stage.addEventListener('pointermove',e=>{if(!points.has(e.pointerId))return;points.set(e.pointerId,[e.clientX,e.clientY]);if(points.size===2){const p=[...points.values()];const d=Math.hypot(p[0][0]-p[1][0],p[0][1]-p[1][1]);if(pinch>0&&d>0)distance=Math.max(1.2,Math.min(4,distance*pinch/d));pinch=d;}else if(drag){yaw-=(e.clientX-drag[0])*.008;pitch=Math.max(-.35,Math.min(1.35,pitch+(e.clientY-drag[1])*.008));}drag=[e.clientX,e.clientY];draw();});
 function stop(e){points.delete(e.pointerId);drag=null;pinch=0;}stage.addEventListener('pointerup',stop);stage.addEventListener('pointercancel',stop);
 stage.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(1.2,Math.min(4,distance*Math.exp(e.deltaY*.001)));draw();},{passive:false});
 root.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{const action=btn.dataset.action;const open=btn.getAttribute('aria-pressed')!=='true';if(action!=='front')btn.setAttribute('aria-pressed',String(open));if(action==='doors'){groups[1].rotation.y=open?1.65:0;groups[2].rotation.y=open?-1.65:0;btn.textContent=open?'Tutup pintu':'Buka pintu';}if(action==='lids'){groups[3].rotation.x=groups[4].rotation.x=open?-1.30:0;btn.textContent=open?'Tutup dasar baki':'Buka tutup bawah';}if(action==='skin'){skins.forEach(s=>s.visible=!open);btn.textContent=open?'Pasang panel':'Lihat rangka';}if(action==='front'){yaw=0;pitch=0;distance=2.28;}draw();status.textContent='Seret untuk memutar · gulir / cubit untuk zoom';}));
 resize();status.textContent='Seret untuk memutar · gulir / cubit untuk zoom';
 root.dataset.ready='true';
 }catch(e){status.textContent='Model belum tampil. Coba buka Penampil-3D.html dari paket unduhan dengan internet aktif.';console.error(e);}
})();
